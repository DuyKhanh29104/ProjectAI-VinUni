previews:
  generation: off

# Demo topology: Render serves only the Vite SPA. The API continues to run on
# the developer workstation and must be exposed through an HTTPS tunnel (for
# example, a temporary trycloudflare.com URL).
services:
  - type: web
    runtime: static
    name: projectai-vinuni-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit

    envVars:
      - key: VITE_DATA_SOURCE
        value: api
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DATASET_ID
        value: nuscenes
      - key: VITE_DATASET_NAME
        value: nuScenes cloud dataset
      - key: VITE_DATASET_FORMAT
        value: nuScenes
      - key: VITE_DATASET_VERSION
        value: v1.0-mini
      - key: VITE_AUTH_MODE
        value: supabase
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
